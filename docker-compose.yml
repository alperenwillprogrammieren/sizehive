services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sizehive
      POSTGRES_PASSWORD: sizehive
      POSTGRES_DB: sizehive
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sizehive"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
